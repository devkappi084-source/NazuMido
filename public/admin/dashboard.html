<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nazumido — Admin-Panel</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Nazumido Admin</h1>
      <div class="topbar-actions">
        <a class="back" href="/">← Zur Website</a>
        <button id="logout" class="linkbtn" hidden>Abmelden</button>
      </div>
    </header>

    <!-- LOGIN -->
    <section id="login-view" class="login">
      <form id="login-form" class="card login-card">
        <h2>Anmeldung</h2>
        <label>Benutzername <input name="username" autocomplete="username" required /></label>
        <label>Passwort <input name="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit">Anmelden</button>
        <p class="hint">Standard (Entwicklung): <code>admin</code> / <code>nazumido</code></p>
      </form>
    </section>

    <!-- APP (nach Login) -->
    <div id="app-view" hidden>
      <nav class="tabs">
        <button class="tab active" data-tab="posts">Beiträge</button>
        <button class="tab" data-tab="settings">Einstellungen</button>
      </nav>

      <main>
        <!-- POSTS -->
        <section id="tab-posts" class="tabpanel active">
          <h2 id="post-form-title">Beitrag anlegen</h2>
          <form id="post-form" class="card">
            <input type="hidden" name="id" />
            <label>Titel <input name="title" required /></label>
            <label>Inhalt <textarea name="content" rows="4"></textarea></label>
            <label>Foto (optional)
              <input name="photo" type="file" accept="image/*" />
            </label>
            <label>Foto-URL
              <input name="photo_url" placeholder="wird beim Hochladen automatisch gesetzt" />
            </label>
            <label class="check">
              <input type="checkbox" name="is_active" checked /> Aktiv (öffentlich sichtbar)
            </label>
            <div class="btnrow">
              <button type="submit">Speichern</button>
              <button type="button" id="post-cancel" class="ghost" hidden>Abbrechen</button>
            </div>
          </form>

          <h2>Bestehende Beiträge</h2>
          <div id="post-list" class="list"></div>
        </section>

        <!-- SETTINGS -->
        <section id="tab-settings" class="tabpanel">
          <h2>Website-Einstellungen</h2>
          <form id="settings-form" class="card">
            <div id="settings-fields"></div>
            <div class="btnrow">
              <button type="submit">Speichern</button>
              <button type="button" id="settings-add" class="ghost">+ Feld hinzufügen</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/admin/admin.js"></script>
  </body>
</html>
