<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nazumido — Admin-Panel</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Nazumido Admin</h1>
      <a class="back" href="/">← Zur Website</a>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="news">Neuigkeiten</button>
      <button class="tab" data-tab="events">Veranstaltungen</button>
      <button class="tab" data-tab="photos">Fotos</button>
    </nav>

    <main>
      <!-- NEWS -->
      <section id="tab-news" class="tabpanel active">
        <h2>Neuigkeit anlegen</h2>
        <form id="news-form" class="card">
          <div class="row">
            <label>Titel <input name="title" required /></label>
            <label>Tag <input name="tag" placeholder="z. B. Rückblick" /></label>
          </div>
          <div class="row">
            <label>Tag-Farbe
              <select name="tag_color">
                <option value="red">Rot</option>
                <option value="green">Grün</option>
                <option value="gold">Gold</option>
              </select>
            </label>
            <label class="check">
              <input type="checkbox" name="feature" /> Als Feature markieren
            </label>
          </div>
          <label>Kurztext <textarea name="excerpt" rows="2"></textarea></label>
          <label>Fließtext <textarea name="body" rows="4"></textarea></label>
          <button type="submit">Speichern</button>
        </form>

        <h2>Bestehende Neuigkeiten</h2>
        <div id="news-list" class="list"></div>
      </section>

      <!-- EVENTS -->
      <section id="tab-events" class="tabpanel">
        <h2>Veranstaltung anlegen</h2>
        <form id="event-form" class="card">
          <div class="row">
            <label>Titel <input name="title" required /></label>
            <label>Art <input name="kind" placeholder="z. B. Gala" /></label>
          </div>
          <div class="row">
            <label>Datum <input name="event_date" type="date" /></label>
            <label>Uhrzeit <input name="event_time" type="time" /></label>
          </div>
          <label>Ort <input name="location" /></label>
          <label>Beschreibung <textarea name="description" rows="3"></textarea></label>
          <button type="submit">Speichern</button>
        </form>

        <h2>Bestehende Veranstaltungen</h2>
        <div id="event-list" class="list"></div>
      </section>

      <!-- PHOTOS -->
      <section id="tab-photos" class="tabpanel">
        <h2>Foto hochladen</h2>
        <form id="photo-form" class="card">
          <label>Titel <input name="title" /></label>
          <label>Gruppe
            <select name="group">
              <option value="">—</option>
              <option>Garde</option>
              <option>Musikzug</option>
              <option>Vorsitz</option>
            </select>
          </label>
          <label>Bilddatei <input name="photo" type="file" accept="image/*" required /></label>
          <button type="submit">Hochladen</button>
        </form>

        <h2>Galerie</h2>
        <div id="photo-list" class="gallery"></div>
      </section>
    </main>

    <div id="toast" class="toast"></div>

    <script src="/admin/admin.js"></script>
  </body>
</html>
