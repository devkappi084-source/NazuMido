<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nazumido — Faschingsverein Micheldorf</title>
    <style>
      :root {
        --red: #c8202c;
        --green: #1e6e3f;
        --gold: #c9a24b;
        --ink: #16140f;
        --paper: #fbf8f2;
        --line: rgba(22, 20, 15, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--paper);
        color: var(--ink);
        line-height: 1.55;
      }
      header {
        background: var(--red);
        color: #fff;
        padding: 2.5rem 1.25rem;
        text-align: center;
      }
      header h1 { margin: 0 0 0.25rem; font-size: 2.2rem; letter-spacing: 0.02em; }
      header p { margin: 0; opacity: 0.9; }
      main { max-width: 820px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
      section { margin-bottom: 2.5rem; }
      h2 {
        font-size: 1.4rem;
        border-bottom: 2px solid var(--gold);
        padding-bottom: 0.35rem;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 1rem 1.15rem;
        margin-bottom: 0.9rem;
      }
      .card img { width: 100%; max-height: 320px; object-fit: cover; border-radius: 8px; margin-bottom: 0.6rem; }
      .card h3 { margin: 0.15rem 0 0.4rem; }
      .muted { color: #7c7363; font-size: 0.85rem; }
      .empty { color: #7c7363; font-style: italic; }
      footer { text-align: center; padding: 2rem; color: #7c7363; font-size: 0.85rem; }
      a.admin-link { color: var(--green); }
    </style>
  </head>
  <body>
    <header>
      <h1 id="vereinsname">Nazumido</h1>
      <p id="beschreibung">Faschingsverein Micheldorf, OÖ · seit 1962</p>
    </header>

    <main>
      <section>
        <h2>Neuigkeiten</h2>
        <div id="posts"><p class="empty">Lädt …</p></div>
      </section>
    </main>

    <footer>
      © 1962–<span id="year"></span> <span id="footer-name">Nazumido</span> ·
      <a class="admin-link" href="/admin">Admin-Panel</a>
    </footer>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();

      async function loadJSON(url) {
        const res = await fetch(url);
        if (!res.ok) throw new Error(url + ' → ' + res.status);
        return res.json();
      }

      function esc(s) {
        return String(s ?? '').replace(/[&<>"]/g, (c) =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])
        );
      }

      async function renderSettings() {
        try {
          const s = await loadJSON('/api/settings');
          if (s.vereinsname) {
            document.getElementById('vereinsname').textContent = s.vereinsname;
            document.getElementById('footer-name').textContent = s.vereinsname;
            document.title = s.vereinsname;
          }
          if (s.beschreibung) {
            document.getElementById('beschreibung').textContent = s.beschreibung;
          }
        } catch (e) {
          /* Header-Standardwerte beibehalten */
        }
      }

      async function renderPosts() {
        const el = document.getElementById('posts');
        try {
          const items = await loadJSON('/api/posts');
          if (!items.length) return (el.innerHTML = '<p class="empty">Noch keine Neuigkeiten.</p>');
          el.innerHTML = items
            .map(
              (p) => `
              <article class="card">
                ${p.photo_url ? `<img src="${esc(p.photo_url)}" alt="${esc(p.title)}" />` : ''}
                <h3>${esc(p.title)}</h3>
                <p>${esc(p.content || '')}</p>
                <p class="muted">${esc((p.created_at || '').slice(0, 16))}</p>
              </article>`
            )
            .join('');
        } catch (e) {
          el.innerHTML = '<p class="empty">Fehler beim Laden.</p>';
        }
      }

      renderSettings();
      renderPosts();
    </script>
  </body>
</html>
