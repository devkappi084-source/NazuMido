<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nazumido — Faschingsverein Micheldorf</title>
    <style>
      :root {
        --red: #c8202c;
        --green: #1e6e3f;
        --gold: #c9a24b;
        --ink: #16140f;
        --paper: #fbf8f2;
        --line: rgba(22, 20, 15, 0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--paper);
        color: var(--ink);
        line-height: 1.55;
      }
      header {
        background: var(--red);
        color: #fff;
        padding: 2.5rem 1.25rem;
        text-align: center;
      }
      header h1 { margin: 0 0 0.25rem; font-size: 2.2rem; letter-spacing: 0.02em; }
      header p { margin: 0; opacity: 0.9; }
      main { max-width: 820px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
      section { margin-bottom: 2.5rem; }
      h2 {
        font-size: 1.4rem;
        border-bottom: 2px solid var(--gold);
        padding-bottom: 0.35rem;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 1rem 1.15rem;
        margin-bottom: 0.9rem;
      }
      .tag {
        display: inline-block;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        color: #fff;
        margin-bottom: 0.4rem;
      }
      .tag.red { background: var(--red); }
      .tag.green { background: var(--green); }
      .tag.gold { background: var(--gold); color: var(--ink); }
      .card h3 { margin: 0.15rem 0 0.4rem; }
      .muted { color: #7c7363; font-size: 0.85rem; }
      .empty { color: #7c7363; font-style: italic; }
      footer { text-align: center; padding: 2rem; color: #7c7363; font-size: 0.85rem; }
      a.admin-link { color: var(--green); }
    </style>
  </head>
  <body>
    <header>
      <h1>Nazumido</h1>
      <p>Faschingsverein Micheldorf, OÖ · seit 1962</p>
    </header>

    <main>
      <section>
        <h2>Neuigkeiten</h2>
        <div id="news"><p class="empty">Lädt …</p></div>
      </section>

      <section>
        <h2>Veranstaltungen</h2>
        <div id="events"><p class="empty">Lädt …</p></div>
      </section>

      <section>
        <h2>Fotogalerie</h2>
        <div id="photos"><p class="empty">Lädt …</p></div>
      </section>
    </main>

    <footer>
      © 1962–<span id="year"></span> Nazumido ·
      <a class="admin-link" href="/admin">Admin-Panel</a>
    </footer>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();

      async function loadJSON(url) {
        const res = await fetch(url);
        if (!res.ok) throw new Error(url + ' → ' + res.status);
        return res.json();
      }

      function esc(s) {
        return String(s ?? '').replace(/[&<>"]/g, (c) =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])
        );
      }

      async function renderNews() {
        const el = document.getElementById('news');
        try {
          const items = await loadJSON('/api/news');
          if (!items.length) return (el.innerHTML = '<p class="empty">Noch keine Neuigkeiten.</p>');
          el.innerHTML = items
            .map(
              (n) => `
              <article class="card">
                <span class="tag ${esc(n.tag_color || 'red')}">${esc(n.tag || 'News')}</span>
                <h3>${esc(n.title)}</h3>
                <p>${esc(n.excerpt || '')}</p>
                <p class="muted">${esc(n.created_at || '')}</p>
              </article>`
            )
            .join('');
        } catch (e) {
          el.innerHTML = '<p class="empty">Fehler beim Laden.</p>';
        }
      }

      async function renderEvents() {
        const el = document.getElementById('events');
        try {
          const items = await loadJSON('/api/events');
          if (!items.length) return (el.innerHTML = '<p class="empty">Keine Termine geplant.</p>');
          el.innerHTML = items
            .map(
              (e) => `
              <article class="card">
                <h3>${esc(e.title)}</h3>
                <p class="muted">${esc(e.event_date || '')} ${esc(e.event_time || '')} · ${esc(e.location || '')}</p>
                <p>${esc(e.description || '')}</p>
              </article>`
            )
            .join('');
        } catch (e) {
          el.innerHTML = '<p class="empty">Fehler beim Laden.</p>';
        }
      }

      async function renderPhotos() {
        const el = document.getElementById('photos');
        try {
          const items = await loadJSON('/api/photos');
          if (!items.length) return (el.innerHTML = '<p class="empty">Noch keine Fotos.</p>');
          el.innerHTML =
            '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.6rem">' +
            items
              .map(
                (p) => `<figure style="margin:0"><img src="${esc(p.url)}" alt="${esc(p.title || '')}"
                  style="width:100%;height:120px;object-fit:cover;border-radius:8px" /></figure>`
              )
              .join('') +
            '</div>';
        } catch (e) {
          el.innerHTML = '<p class="empty">Fehler beim Laden.</p>';
        }
      }

      renderNews();
      renderEvents();
      renderPhotos();
    </script>
  </body>
</html>
