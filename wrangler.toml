# Cloudflare Pages — Projekt "nazumido"
#
# public/     wird 1:1 als statische Website ausgeliefert (kein Build-Schritt).
# functions/  enthält die Pages Function, die /api/*, /uploads/*, /admin,
#             /login und (für den Coming-Soon-Modus) die Startseite bedient —
#             welche Pfade das sind, steht in public/_routes.json.
#
# Deploy:  npx wrangler pages deploy        (oder Git-Integration im Dashboard:
#          Build-Befehl leer lassen, Ausgabeverzeichnis "public")
name = "nazumido"
pages_build_output_dir = "./public"
compatibility_date = "2024-09-23"

# ---------------------------------------------------------------------------
# D1 — SQLite-kompatible Datenbank (Reservierungen, API).
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "nazumido-db"
database_id = "9e08812e-fcd9-4be5-9d8f-20e284cadde9"

# ---------------------------------------------------------------------------
# R2 — Objektspeicher für hochgeladene Fotos (optional).
# Bucket anlegen mit: `npx wrangler r2 bucket create nazumido-uploads`
# ---------------------------------------------------------------------------
#[[r2_buckets]]
#binding = "BUCKET"
#bucket_name = "nazumido-uploads"

# ---------------------------------------------------------------------------
# Nicht-geheime Variablen. GEHEIMNISSE (JWT_SECRET, ADMIN_PASSWORD, Mail-API-
# Schlüssel) NICHT hier eintragen, sondern verschlüsselt setzen:
#   npx wrangler pages secret put JWT_SECRET
#   npx wrangler pages secret put ADMIN_PASSWORD
#   npx wrangler pages secret put RESEND_API_KEY   # oder BREVO_/MAILGUN_API_KEY
# Siehe DEPLOY-CLOUDFLARE.md.
# ---------------------------------------------------------------------------
[vars]
# "true" zeigt Besuchern public/coming-soon.html statt der Website.
# Vorschau fürs Team: /?vorschau  (beenden: /?vorschau=aus). Soll die Vorschau
# geschützt sein: npx wrangler pages secret put PREVIEW_KEY  → /?vorschau=<key>
COMING_SOON = "false"
ADMIN_USERNAME = "admin"
JWT_EXPIRES_IN = "604800"     # 7 Tage in Sekunden
MAX_UPLOAD_SIZE = "5242880"   # 5 MB
# MAIL_FROM  = "Faschingsverein Nazumido <tickets@nazu-mido.at>"
# CLUB_EMAIL = "Nazu.Mido@gmx.at"
# MAIL_PROVIDER = "resend"    # nur nötig, wenn mehrere Schlüssel gesetzt sind
# MAILGUN_DOMAIN = "mg.nazu-mido.at"
# MAILGUN_REGION = "eu"
